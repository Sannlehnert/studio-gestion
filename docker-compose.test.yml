services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Definir TEST_POSTGRES_PASSWORD en apps/backend/.env.test}
      POSTGRES_DB: studio_gestion_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_test -d studio_gestion_test"]
      interval: 2s
      timeout: 5s
      retries: 20
